name: "publish"

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            script: "tauri:macos"
            rust_target: "aarch64-apple-darwin,x86_64-apple-darwin"
            bundle_path: "src-tauri/target/universal-apple-darwin/release/bundle/dmg"
            artifact_name: "macos"
            artifact_ext: "dmg"
          - platform: "windows-latest"
            script: "tauri:windows:installer"
            rust_target: ""
            bundle_path: "src-tauri/target/release/bundle/nsis"
            artifact_name: "windows-x64"
            artifact_ext: "exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: npm ci

      - name: build
        run: npm run ${{ matrix.script }}
        env:
          # 자동 업데이트 서명 키 (저장소 Settings → Secrets and variables → Actions)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: build portable (Windows only)
        if: matrix.platform == 'windows-latest'
        run: npm run tauri:windows:portable

      - name: get version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: rename installer artifact
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SRC=$(ls "${{ matrix.bundle_path }}"/*.${{ matrix.artifact_ext }} | head -1)
          cp "$SRC" "school-record-app-${VERSION}-${{ matrix.artifact_name }}-setup.${{ matrix.artifact_ext }}"

      - name: collect updater artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p updater
          EXE=$(ls "${{ matrix.bundle_path }}"/*_${VERSION}_x64-setup.exe | head -1)
          test -f "$EXE.sig" || { echo "updater signature not found: $EXE.sig"; exit 1; }
          cp "$EXE"     "updater/school-record-app-${VERSION}-windows-x64-setup.exe"
          cp "$EXE.sig" "updater/school-record-app-${VERSION}-windows-x64-setup.exe.sig"

      - name: collect updater artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p updater
          TGZ=$(ls src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz | head -1)
          test -f "$TGZ.sig" || { echo "updater signature not found: $TGZ.sig"; exit 1; }
          cp "$TGZ"     "updater/school-record-app-${VERSION}-macos-universal.app.tar.gz"
          cp "$TGZ.sig" "updater/school-record-app-${VERSION}-macos-universal.app.tar.gz.sig"

      - name: upload updater artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-updater
          path: updater/*

      - name: rename portable artifact (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cp "src-tauri/target/release/school-record-app.exe" \
             "school-record-app-${VERSION}-windows-x64-portable.exe"

      - name: zip installer artifact (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $FILENAME = "school-record-app-${VERSION}-${{ matrix.artifact_name }}-setup.exe"
          Compress-Archive -Path $FILENAME -DestinationPath ($FILENAME -replace '\.exe$', '.zip')

      - name: zip portable artifact (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $FILENAME = "school-record-app-${VERSION}-windows-x64-portable.exe"
          Compress-Archive -Path $FILENAME -DestinationPath ($FILENAME -replace '\.exe$', '.zip')

      - name: upload installer artifact (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-setup
          path: school-record-app-${{ steps.version.outputs.VERSION }}-${{ matrix.artifact_name }}-setup.dmg

      - name: upload installer artifact (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-setup
          path: school-record-app-${{ steps.version.outputs.VERSION }}-${{ matrix.artifact_name }}-setup.zip

      - name: upload portable artifact (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-portable
          path: school-record-app-${{ steps.version.outputs.VERSION }}-windows-x64-portable.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: get version
        id: version
        run: |
          VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: make latest.json (auto update manifest)
        run: |
          node .github/scripts/make-latest-json.mjs "${{ steps.version.outputs.VERSION }}" artifacts
          # 서명은 latest.json 안에 들어갔으므로 .sig 파일은 올리지 않는다
          rm -f artifacts/*.sig

      # 초안(draft)으로 만든다. GitHub에서 「Publish release」를 누르는 순간
      # releases/latest 가 이 버전을 가리키고, 설치된 프로그램들이 업데이트를 받기 시작한다.
      - name: create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "See the assets to download this version and install." \
            --draft \
            artifacts/*
